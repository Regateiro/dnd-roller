[tool.poetry]
name = "dnd-roller"
version = "0.1.0"
description = ""
authors = ["Diogo Regateiro"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.10"
python-dateutil = "^2.9.0"
d20 = "^1.1.2"
discord = "^2.3.2"
str2bool = "^1.1"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.3.0"
isort = "^6.0.1"
pylint = "^3.3.7"
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^7.1.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.coverage.run]
omit = ["*/tests/*", "*/bot/client.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
